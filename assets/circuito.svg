-size="18" font-weight="700" fill="#13786c">Sinal digital exclusivo*</text><text x="610" y="681" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#815a14">GPIO e nível ativo: confirmar</text><text x="610" y="745" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#4b6372">VCC e GND do relé: conferir origem e tensão.</text><text x="40" y="815" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#4b6372">* Confirmar que o modelo usa GPIO. Não há transistor, relé genérico ou protoboard presumida.</text></svg>