<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1684 2384" role="img"><title>Arcanjos NFC Access - banner</title><rect x="0" y="0" width="1684" height="2384" fill="#f3f6f6" stroke="none"/><rect x="0" y="0" width="1684" height="510" fill="#102536" stroke="none"/><rect x="75" y="72" width="95" height="7" fill="#79e3cd" stroke="none"/><text x="75" y="135" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#79e3cd">PROJETO INTEGRADOR 6  /  PRIMEIRA ENTREGA N1</text><text x="75" y="256" font-family="Arial,sans-serif" font-size="112" font-weight="700" fill="#ffffff">ARCANJOS</text><text x="82" y="335" font-family="Arial,sans-serif" font-size="57" font-weight="700" fill="#79e3cd">NFC ACCESS</text><text x="82" y="411" font-family="Arial,sans-serif" font-size="33" font-weight="400" fill="#ffffff">Identificação por aproximação, decisão local e registro de eventos em uma plataforma IoT.</text><rect x="0" y="510" width="1684" height="140" fill="#e1ebee" stroke="none"/><text x="80" y="557" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#183447">Instituição: PREENCHER  |  Curso / turma: PREENCHER</text><text x="80" y="605" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#183447">Integrantes / RAs: PREENCHER  |  Professor: PREENCHER  |  Data: PREENCHER</text><text x="80" y="735" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#13786c">01 / PROBLEMA E OBJETIVO</text><text x="80" y="790" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183447">Organizar a identificação de usuários e a consulta de</text><text x="80" y="832.05" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183447">eventos em um protótipo de controle de acesso.</text><text x="80" y="874.0999999999999" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183447">Integrar leitura por aproximação, autorização local e</text><text x="80" y="916.1499999999999" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183447">armazenamento de registros.</text><text x="905" y="735" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#13786c">02 / COMO FUNCIONA</text><text x="905" y="790" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183447">O RFID2 lê o UID. O AtomS3 Lite compara o</text><text x="905" y="832.05" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183447">identificador com a lista de permissões e aciona o</text><text x="905" y="874.0999999999999" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183447">módulo M5Stack Relay quando autorizado. O evento</text><text x="905" y="916.1499999999999" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183447">segue por MQTT para a plataforma.</text><text x="80" y="1020" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#13786c">03 / ARQUITETURA DO SISTEMA</text><rect x="80" y="1070" width="330" height="118" fill="#ffffff" stroke="#b9cbd1"/><text x="100" y="1115" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183447">TAG RFID/NFC</text><text x="100" y="1156" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#4b6372">Aproximação</text><rect x="460" y="1070" width="330" height="118" fill="#ffffff" stroke="#b9cbd1"/><text x="480" y="1115" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183447">RFID2</text><text x="480" y="1156" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#4b6372">Leitura do UID</text><rect x="840" y="1070" width="330" height="118" fill="#ffffff" stroke="#b9cbd1"/><text x="860" y="1115" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183447">ATOMS3 LITE</text><text x="860" y="1156" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#4b6372">Decisão local</text><rect x="1220" y="1070" width="330" height="118" fill="#ffffff" stroke="#b9cbd1"/><text x="1240" y="1115" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183447">M5STACK RELAY</text><text x="1240" y="1156" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#4b6372">Acionamento</text><polyline points="410,1129 460,1129" fill="none" stroke="#13786c" stroke-width="3"/><polyline points="449.1946347717679,1134.2195864093349 460,1129 449.1946347717679,1123.7804135906651" fill="none" stroke="#13786c" stroke-width="3"/><polyline points="790,1129 840,1129" fill="none" stroke="#13786c" stroke-width="3"/><polyline points="829.1946347717678,1134.2195864093349 840,1129 829.1946347717678,1123.7804135906651" fill="none" stroke="#13786c" stroke-width="3"/><polyline points="1170,1129 1220,1129" fill="none" stroke="#13786c" stroke-width="3"/><polyline points="1209.1946347717678,1134.2195864093349 1220,1129 1209.1946347717678,1123.7804135906651" fill="none" stroke="#13786c" stroke-width="3"/><polyline points="1005,1188 1005,1230 245,1230 245,1280" fill="none" stroke="#13786c" stroke-width="3"/><polyline points="239.78041359066523,1269.1946347717678 245,1280 250.21958640933477,1269.1946347717678" fill="none" stroke="#13786c" stroke-width="3"/><text x="365" y="1220" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13786c">Wi-Fi / MQTT · evento JSON</text><rect x="80" y="1280" width="330" height="118" fill="#ffffff" stroke="#b9cbd1"/><text x="100" y="1325" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183447">EMQX</text><text x="100" y="1366" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#4b6372">Broker MQTT</text><rect x="460" y="1280" width="330" height="118" fill="#ffffff" stroke="#b9cbd1"/><text x="480" y="1325" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183447">RULE ENGINE</text><text x="480" y="1366" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#4b6372">Ação MySQL</text><rect x="840" y="1280" width="330" height="118" fill="#ffffff" stroke="#b9cbd1"/><text x="860" y="1325" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183447">MYSQL</text><text x="860" y="1366" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#4b6372">Persistência</text><rect x="1220" y="1280" width="330" height="118" fill="#ffffff" stroke="#b9cbd1"/><text x="1240" y="1325" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183447">VISUALIZAÇÃO</text><text x="1240" y="1366" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#4b6372">Exportação / web</text><polyline points="410,1339 460,1339" fill="none" stroke="#13786c" stroke-width="3"/><polyline points="449.1946347717679,1344.2195864093349 460,1339 449.1946347717679,1333.7804135906651" fill="none" stroke="#13786c" stroke-width="3"/><polyline points="790,1339 840,1339" fill="none" stroke="#13786c" stroke-width="3"/><polyline points="829.1946347717678,1344.2195864093349 840,1339 829.1946347717678,1333.7804135906651" fill="none" stroke="#13786c" stroke-width="3"/><polyline points="1170,1339 1220,1339" fill="none" stroke="#13786c" stroke-width="3" stroke-dasharray="8 6"/><polyline points="1209.1946347717678,1344.2195864093349 1220,1339 1209.1946347717678,1333.7804135906651" fill="none" stroke="#13786c" stroke-width="3"/><text x="80" y="1450" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#4b6372">Linha tracejada: consulta no DBeaver e exportação manual de JSON para a aplicação web. Consulta automática via API é uma evolução</text><text x="80" y="1483.35" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#4b6372">futura.</text><text x="80" y="1580" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#13786c">04 / MATERIAIS DA N1</text><text x="80" y="1640" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183447">GitPage: Home, Plataforma, Dispositivos e Aplicativo.</text><text x="80" y="1682.05" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183447">Firmware configurável, diagrama completo, circuito</text><text x="80" y="1724.1" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183447">funcional e visualizador de registros JSON.</text><text x="905" y="1580" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#13786c">05 / VALIDAÇÃO PREVISTA</text><text x="905" y="1640" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183447">Conferir montagem, compilar o firmware e testar</text><text x="905" y="1682.05" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183447">autorização e negação. Registrar o acionamento do</text><text x="905" y="1724.1" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183447">relé, as mensagens MQTT e as linhas inseridas no</text><text x="905" y="1766.1499999999999" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#183447">banco.</text><rect x="80" y="1870" width="1520" height="195" fill="#e1ebee" stroke="none"/><text x="110" y="1920" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#815a14">CONFIRMAR NA MONTAGEM</text><text x="110" y="1970" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#183447">Portas, GPIOs, alimentação e nível ativo do relé. Esta versão não declara testes físicos concluídos. O circuito usa os</text><text x="110" y="2007.7" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#183447">módulos atuais, sem presumir carga externa ou protoboard.</text><text x="80" y="2150" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#13786c">LIMITES E PRÓXIMOS PASSOS</text><text x="80" y="2196" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#4b6372">UID não é autenticação criptográfica. Autorização não comprova passagem física. Os exemplos da página são fictícios. Próximos passos:</text><text x="80" y="2230.8" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#4b6372">evidências de bancada e consulta automática protegida.</text><rect x="0" y="2320" width="1684" height="64" fill="#102536" stroke="none"/><text x="80" y="2360" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#ffffff">REFERÊNCIAS: M5Stack (RFID2 / Unit Relay) e EMQX (MySQL). Links completos em docs/fontes.md.</text></svg>